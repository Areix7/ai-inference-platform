---
# Global variables for AI Inference Platform.
# All role-level tunables live here. Do not edit roles for env changes.

data_dir: /root/ai-inference-platform//data
fallback_data_dir: /opt

# vLLM
vllm_model: "Qwen/Qwen3-8B"
vllm_port: 8000
vllm_host: "0.0.0.0"
vllm_gpu_memory_utilization: 0.90
vllm_max_model_len: 8192
vllm_dtype: "auto"

# System
timezone: "Asia/Shanghai"

# Disk thresholds for inspect role
disk_warn_percent: 80
vllm_image: "vllm/vllm-openai:latest"

# Monitoring
dcgm_port: 9400
dcgm_exporter_image: "nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubi9"

# Prometheus
prometheus_port: 9090
prometheus_retention: "15d"
prometheus_image: "prom/prometheus:latest"

# Grafana
grafana_port: 3000
grafana_admin_password: "changeme"
grafana_image: "grafana/grafana:latest"
