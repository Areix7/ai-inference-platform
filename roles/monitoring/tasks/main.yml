---

# DCGM Exporter

- name: pull dcgm-exporter image
  command: docker pull {{ dcgm_exporter_image }}
  register: dcgm_pull
  changed_when: "'Downloaded newer image' in dcgm_pull.stdout or 'Pull complete' in dcgm_pull.stdout"
  tags: [monitoring, dcgm]

- name: deploy dcgm-exporter systemd unit
  template:
    src: dcgm-exporter.service.j2
    dest: /etc/systemd/system/dcgm-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and restart dcgm-exporter
  tags: [monitoring, dcgm, dcgm_systemd]

- name: flush handlers after dcgm-exporter
  meta: flush_handlers
  tags: [monitoring, dcgm]

- name: wait for dcgm-exporter to respond
  uri:
    url: "http://127.0.0.1:{{ dcgm_port }}/metrics"
    status_code: 200
    timeout: 10
  register: dcgm_ready
  until: dcgm_ready.status == 200
  retries: 30
  delay: 5
  tags: [monitoring, dcgm, dcgm_verify]

- name: count dcgm metrics
  shell: "curl -s http://127.0.0.1:{{ dcgm_port }}/metrics | grep -c 'DCGM_FI' || true"
  register: dcgm_count
  changed_when: false
  tags: [monitoring, dcgm, dcgm_verify]

- name: assert dcgm metrics present
  assert:
    that: dcgm_count.stdout | int > 0
    fail_msg: "no DCGM_FI metrics found, dcgm-exporter may be broken"
  tags: [monitoring, dcgm, dcgm_verify]

- name: print dcgm status
  debug:
    msg:
      - "dcgm exporter: http://localhost:{{ dcgm_port }}/metrics"
      - "dcgm metric lines: {{ dcgm_count.stdout }}"
  tags: [monitoring, dcgm, dcgm_verify]


- name: ensure prometheus config dir exists
  file:
    path: /opt/prometheus
    state: directory
    mode: "0755"
  tags: [monitoring, prometheus]

- name: render prometheus config
  template:
    src: prometheus.yml.j2
    dest: /opt/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  tags: [monitoring, prometheus]

- name: pull prometheus image
  command: docker pull {{ prometheus_image }}
  register: prom_pull
  changed_when: "'Downloaded newer image' in prom_pull.stdout or 'Pull complete' in prom_pull.stdout"
  tags: [monitoring, prometheus]

- name: deploy prometheus systemd unit
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and restart prometheus
  tags: [monitoring, prometheus, prometheus_systemd]

- name: flush handlers after prometheus
  meta: flush_handlers
  tags: [monitoring, prometheus]

- name: wait for prometheus to respond
  uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/-/healthy"
    status_code: 200
    timeout: 10
  register: prom_ready
  until: prom_ready.status == 200
  retries: 30
  delay: 5
  tags: [monitoring, prometheus, prometheus_verify]

- name: print prometheus status
  debug:
    msg:
      - "prometheus: http://localhost:{{ prometheus_port }}"
  tags: [monitoring, prometheus, prometheus_verify]


- name: ensure grafana directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/grafana
    - /opt/grafana/data
    - /opt/grafana/provisioning
    - /opt/grafana/provisioning/datasources
    - /opt/grafana/provisioning/dashboards
    - /opt/grafana/dashboards
  tags: [monitoring, grafana]

- name: chown grafana data dir to 472
  file:
    path: /opt/grafana/data
    owner: 472
    group: 472
    recurse: true
  tags: [monitoring, grafana]

- name: render grafana datasource provisioning
  template:
    src: grafana-datasource.yml.j2
    dest: /opt/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  tags: [monitoring, grafana]

- name: render grafana dashboard provisioning
  template:
    src: grafana-dashboards.yml.j2
    dest: /opt/grafana/provisioning/dashboards/dashboards.yml
    owner: root
    group: root
    mode: "0644"
  tags: [monitoring, grafana]

- name: copy gpu dashboard json
  copy:
    src: gpu-dashboard.json
    dest: /opt/grafana/dashboards/gpu.json
    owner: root
    group: root
    mode: "0644"
  tags: [monitoring, grafana]

- name: copy vllm dashboard json
  copy:
    src: vllm-dashboard.json
    dest: /opt/grafana/dashboards/vllm.json
    owner: root
    group: root
    mode: "0644"
  tags: [monitoring, grafana]

- name: pull grafana image
  command: docker pull {{ grafana_image }}
  register: grafana_pull
  changed_when: "'Downloaded newer image' in grafana_pull.stdout or 'Pull complete' in grafana_pull.stdout"
  tags: [monitoring, grafana]

- name: deploy grafana systemd unit
  template:
    src: grafana.service.j2
    dest: /etc/systemd/system/grafana.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and restart grafana
  tags: [monitoring, grafana, grafana_systemd]

- name: flush handlers after grafana
  meta: flush_handlers
  tags: [monitoring, grafana]

- name: wait for grafana to respond
  uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    status_code: 200
    timeout: 10
  register: grafana_ready
  until: grafana_ready.status == 200
  retries: 30
  delay: 5
  tags: [monitoring, grafana, grafana_verify]

- name: print grafana status
  debug:
    msg:
      - "grafana: http://localhost:{{ grafana_port }}"
      - "user: admin"
      - "password: {{ grafana_admin_password }}"
  tags: [monitoring, grafana, grafana_verify]
