---
- name: reload systemd and restart dcgm-exporter
  systemd:
    name: dcgm-exporter
    state: restarted
    enabled: true
    daemon_reload: true

- name: reload systemd and restart prometheus
  systemd:
    name: prometheus
    state: restarted
    enabled: true
    daemon_reload: true

- name: reload systemd and restart grafana
  systemd:
    name: grafana
    state: restarted
    enabled: true
    daemon_reload: true
