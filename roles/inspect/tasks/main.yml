---
# node inspection script, runs via cron every 5 min

- name: ensure config dir
  file:
    path: /etc/ai-platform
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: install inspect config and script
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: inspect.conf,            dest: /etc/ai-platform/inspect.conf,              mode: "0644" }
    - { src: ai-platform-inspect.sh,  dest: /usr/local/bin/ai-platform-inspect.sh,      mode: "0755" }

- name: ensure textfile collector dir
  file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: add inspect cron
  copy:
    dest: /etc/cron.d/ai-platform-inspect
    content: |
      */5 * * * * root /usr/local/bin/ai-platform-inspect.sh
    owner: root
    group: root
    mode: "0644"

- name: run inspect now
  command: /usr/local/bin/ai-platform-inspect.sh
  register: ir
  changed_when: false
  failed_when: false

- name: show inspect exit code
  debug:
    msg: "exit code: {{ ir.rc }}"
